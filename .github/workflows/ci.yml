name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      # The moving v6 tag predates pnpm 12 support, which came in v6.1.0.
      - uses: pnpm/action-setup@v6.1.0
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Check the types of the packed package
        run: pnpm dlx @arethetypeswrong/cli@0.18.5 --pack packages/main
      - name: Install the smoke test
        working-directory: smoke
        run: npm install
      - name: Install the packed tarball
        working-directory: smoke
        run: npm run use:local
      - name: Run the smoke test against the packed tarball
        working-directory: smoke
        run: npm test
